# Samir Libari World Artist Manifest Architecture
# Targets: HP PC Native & Samsung Galaxy Android Network Node
metadata:
  project_name: "Samir Libari"
  target_region: "New York"
  deployment_version: "2.5.0"

network_routing:
  gateway_ip: "45.219.113.102"
  protocol: "http"
  api_version: "v1beta"
  active_model: "gemini-2.5-flash"

security_credentials:
  api_key_mapping: "${GEMINI_API_KEY}"
  discord_token_sync: "${DISCORD_APP_TOKEN}"
  application_id: "${CHICOLOCO40_APP_ID}"

platform_nodes:
  desktop:
    environment: "HP PC"
    source_files:
      - "samir_libari_pc_gateway.py"
      - "GeminiClientPC.cpp"
      - "GeminiClientPC.h"
  mobile:
    environment: "Samsung Galaxy Android"
    source_directory: "GeminiMobileApp/android/"
    entry_point: "SamirLibariAndroidClient.kt"

automation_rules:
  stream_routing: "direct"
  cache_policy: "bypass_local"
  indexing_override: "US_EAST_NY"
