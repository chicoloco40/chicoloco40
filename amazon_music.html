<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CL40 World | Amazon Music Ecosystem</title>
    <meta name="author" content="Samir Libari (Chico Loco 40 / CL40)">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        header {
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin: 0 0 5px 0;
            color: #fff;
        }
        p {
            font-size: 0.85rem;
            color: #888;
            margin: 0 0 15px 0;
        }
        .controls {
            margin-bottom: 15px;
        }
        button {
            background-color: #111;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            margin: 0 5px;
            border-radius: 4px;
        }
        button:hover {
            background-color: #222;
            border-color: #555;
        }
        #amazon-iframe {
            border-radius: 12px;
            border: 1px solid #222;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            max-width: 500px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CHICO LOCO 40 (CL40)</h1>
        <p>Amazon Music Official Releases & Podcasts</p>
    </header>

    <div class="controls">
        <button onclick="previousRelease()">Previous</button>
        <button onclick="nextRelease()">Next Release</button>
    </div>

    <iframe id="amazon-iframe" 
        src="https://music.amazon.co.uk/embed/B0HLG7XHJ8?autoplay=false" 
        width="100%" 
        height="352" 
        frameBorder="0" 
        allowfullscreen="" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy">
    </iframe>

    <script>
        const amazonItems = [
            'B0HLG7XHJ8', 'B0H3Q9WPQX', 'B0H34CXLT3', 'B0H275WT2S', 'B0H321VBMZ', 
            'B0H274QST1', 'B0H28J6BJF', 'B0H31FJNNQ', 'B0H26ZH6H3', 'B0H2BQGF9R',
            'B0HLFWMB8H', 'B0H3Q8GK7K', 'B0H341N275', 'B0H278RZ3W', 'B0H31G8JSS', 
            'B0H277ZL3D', 'B0H28MVDJN', 'B0H31RZB6J', 'B0H279HXGG', 'B0H2BR33SQ'
        ];

        let currentIndex = 0;

        function updateAmazonPlayer() {
            const id = amazonItems[currentIndex];
            const iframe = document.getElementById('amazon-iframe');
            iframe.src = `https://music.amazon.co.uk/embed/${id}?autoplay=false`;
        }

        function nextRelease() {
            currentIndex = (currentIndex + 1) % amazonItems.length;
            updateAmazonPlayer();
        }

        function previousRelease() {
            currentIndex = (currentIndex - 1 + amazonItems.length) % amazonItems.length;
            updateAmazonPlayer();
        }
    </script>

</body>
</html>
