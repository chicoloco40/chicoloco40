<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cl40 world — 3d spatial core</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Courier New", Courier, monospace;
      text-transform: lowercase;
    }

    body {
      background: #050505;
      color: #fff;
      overflow: hidden;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    #canvas-container canvas {
      display: block;
    }

    .hud {
      position: relative;
      z-index: 2;
      height: 100vh;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
    }

    .header {
      border-left: 3px solid #d90429;
      padding-left: 1rem;
    }

    .header h1 {
      font-size: 1.5rem;
      letter-spacing: 2px;
    }

    .header p {
      margin-top: 0.25rem;
      color: #d90429;
      font-size: 0.85rem;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      pointer-events: auto;
    }

    .links a {
      padding: 0.6rem 1.2rem;
      border: 1px solid #d90429;
      background: rgba(10, 10, 10, 0.85);
      color: #fff;
      text-decoration: none;
      font-size: 0.85rem;
      transition: background 0.2s, color 0.2s;
    }

    .links a:hover {
      background: #d90429;
      color: #050505;
    }

    @media (max-width: 600px) {
      .hud {
        padding: 1.25rem;
      }

      .header h1 {
        font-size: 1.15rem;
      }
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
      }
    }
  </script>
</head>

<body>
  <div id="canvas-container"></div>

  <div class="hud">
    <header class="header">
      <h1>cl40 world // 3d spatial core</h1>
      <p>samir libari • interactive matrix node</p>
    </header>

    <nav class="links" aria-label="Social links">
      <a href="https://cl40.contact" target="_blank" rel="noopener noreferrer">
        cl40.contact
      </a>
      <a href="https://github.com/chicoloco40" target="_blank" rel="noopener noreferrer">
        github/chicoloco40
      </a>
    </nav>
  </div>

  <script type="module">
    import * as THREE from "three";

    const container = document.getElementById("canvas-container");

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.035);

    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.z = 8;

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Central 3D wireframe structure
    const coreGroup = new THREE.Group();
    scene.add(coreGroup);

    const outerMesh = new THREE.Mesh(
      new THREE.IcosahedronGeometry(2.2, 1),
      new THREE.MeshBasicMaterial({
        color: 0xd90429,
        wireframe: true,
        transparent: true,
        opacity: 0.75
      })
    );
    coreGroup.add(outerMesh);

    const innerMesh = new THREE.Mesh(
      new THREE.OctahedronGeometry(1.1, 0),
      new THREE.MeshBasicMaterial({
        color: 0xffffff,
        wireframe: true,
        transparent: true,
        opacity: 0.5
      })
    );
    coreGroup.add(innerMesh);

    // Surrounding particle field
    const particlesCount = 900;
    const positions = new Float32Array(particlesCount * 3);

    for (let i = 0; i < positions.length; i++) {
      positions[i] = (Math.random() - 0.5) * 35;
    }

    const particlesGeometry = new THREE.BufferGeometry();
    particlesGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(positions, 3)
    );

    const particles = new THREE.Points(
      particlesGeometry,
      new THREE.PointsMaterial({
        color: 0xd90429,
        size: 0.06,
        transparent: true,
        opacity: 0.8
      })
    );
    scene.add(particles);

    // Mouse and touch interaction
    let targetX = 0;
    let targetY = 0;

    function updatePointer(event) {
      targetX = (event.clientX / window.innerWidth - 0.5) * 2;
      targetY = (event.clientY / window.innerHeight - 0.5) * 2;
    }

    window.addEventListener("pointermove", updatePointer);

    // Animation loop
    function animate() {
      requestAnimationFrame(animate);

      outerMesh.rotation.x += 0.004;
      outerMesh.rotation.y += 0.006;

      innerMesh.rotation.x -= 0.008;
      innerMesh.rotation.y -= 0.005;

      particles.rotation.y += 0.0012;

      coreGroup.rotation.y += (targetX * 0.5 - coreGroup.rotation.y) * 0.05;
      coreGroup.rotation.x += (targetY * 0.5 - coreGroup.rotation.x) * 0.05;

      renderer.render(scene, camera);
    }

    animate();

    // Responsive resizing
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });
  </script>
</body>
</html>
