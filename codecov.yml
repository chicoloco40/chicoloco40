// PATHWAY I: Multi-Tenant Inbound Webhook Interaction Router (Discord)
app.post('/interactions/:clientId', async (req, res) => {
    const { clientId } = req.params;
    const activeApp = ENTERPRISE_REGISTRY[clientId];

    if (!activeApp) return res.status(404).json({ error: 'Target App ID context not found in registry.' });

    const signature = req.get('X-Signature-Ed25519');
    const timestamp = req.get('X-Signature-Timestamp');
    
    if (!signature || !timestamp || !req.rawBody) {
        return res.status(401).end('Handshake terminated: Missing cryptographic headers.');
    }

    try {
        const isVerified = crypto.verify(
            null,
            Buffer.concat([Buffer.from(timestamp), req.rawBody]),
            crypto.createPublicKey({
                key: Buffer.from(activeApp.publicKey, 'hex'),
                format: 'der',
                type: 'public',
                encoding: 'ed25519'
            }),
            Buffer.from(signature, 'hex')
        );

        if (!isVerified) return res.status(401).end('Cryptographic verification failed.');
    } catch (err) {
        return res.status(500).end('Internal signature matching core error.');
    }

    const payload = req.body;
    if (payload.type === 1) return res.json({ type: 1 });

    if (payload.type === 2) {
        return res.json({
            type: 4,
            data: { content: `🌐 **[${activeApp.name}]** Request handled securely by corporate deployment cluster.` }
        });
    }
    return res.status(400).end('Transaction context outside active boundaries.');
});

// PATHWAY II: Dynamic Multi-Tenant OAuth2 Redirection Processor
app.get('/oauth/callback', async (req, res) => {
    const { code } = req.query;
    if (!code) return res.status(400).send('Authorization signature dropped.');

    const comingHost = req.get('host');
    let clientId, clientSecret;

    if (comingHost.includes('founder.cl40.world')) {
        const isGameFlow = req.query.state === 'space_gaming'; 
        clientId = isGameFlow ? '1548272305598369834' : '1514809496449581086';
        clientSecret = isGameFlow ? process.env.SECRET_SPACE_GAMING : process.env.SECRET_BEATS_2;
    } else if (comingHost.includes('biography.lb0025.store')) {
        clientId = '1548154374176641075';
        clientSecret = process.env.SECRET_LB0025;
    } else {
        clientId = '1510455630387740812';
        clientSecret = process.env.SECRET_MAIN_CL40;
    }

    const appConfig = ENTERPRISE_REGISTRY[clientId];

    try {
        const tokenParams = new URLSearchParams({
            client_id: clientId,
            client_secret: clientSecret,
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: appConfig.redirectUri
        });

        const tokenTx = await axios.post('https://discord.com', tokenParams, {
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
        });

        const userTx = await axios.get('https://discord.com', {
            headers: { Authorization: `Bearer ${tokenTx.data.access_token}` }
        });

        return res.json({
            status: "Sovereign Asset Handshake Succeeded",
            context: appConfig.name,
            account_username: userTx.data.username
        });
    } catch (error) {
        return res.status(500).send('OAuth2 verification collapsed.');
    }
});

