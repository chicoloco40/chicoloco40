 and its algorithms. I have no desire for fame if it comes at the cost of my dignity and human worth—a human being is born with inherent dignity and principles. No one should be targeted or blacklisted from platforms. If you are looking for an "artist," I am not that; rather, I bring a passion that produces work of the highest caliber. It will take many years for Morocco to understand that music is merely an idea—an idea that, when it swirls in one’s mind, is often linked to the <em>shaytan</em> (devil) or the <em>qarin</em> (a spiritual companion/double).</p><p></p><p>I will never forget the pardon granted to me in prison by His Majesty King Mohammed VI in 2023. Thank you, Your Majesty King Mohammed VI. If I have said anything wrong, please understand that I am in a complex psychological state, caught between my artistic aspirations and a criminal past. I do not want to lose my life; I want to become a world-class artist. I have taken steps to ensure everything is now legal. Thank you.</p><p> </p><p><a target="_blank" rel="noopener noreferrer nofollow" href="https://cl40.world">https://cl40.world</a></p><p><a target="_blank" rel="noopener noreferrer nofollow" href="https://cl40.contact">https://cl40.contact</a></p><p><a target="_blank" rel="noopener noreferrer nofollow" href="https://134space.cl40.world">https://134space.cl40.world</a></p><p><a target="_blank" rel="noopener noreferrer nofollow" href="https://myjob.cl40.world">https://myjob.cl40.world</a></p><p> </p><p>Owner Label: CL40 World</p><p>Owner Studio Music Publisher: WR Beats &amp; WR Beats Records &amp; WR</p><p>Owner Gaming App: CL40 World Space</p><p> </p><p>Producer: QUARANTA-FOUR-ZERO</p><p>Songwriter: Samir Libari</p><p>Publisher Artist: Chico Loco 40 (Since Active of 2014)</p><p>Publisher Journalism: Samir Libari</p><p>Legacy: M'Hamed Libari (Since active of 2010)</p><p></p><p>No Independent.</p><p>International.</p><p>P2P</p> <br/><br/>This is a public episode. If you would like to discuss this with other subscribers or get access to bonus episodes, visit <a href="https://cl40worldspace.substack.com?utm_medium=podcast&#38;utm_campaign=CTA_1">cl40worldspace.substack.com</a> ]]>
