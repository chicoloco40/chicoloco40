<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CL40 World | Spotify Stream Ecosystem</title>
    <meta name="author" content="Samir Libari (Chico Loco 40 / CL40)">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        header {
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin: 0 0 5px 0;
            color: #fff;
        }
        p {
            font-size: 0.85rem;
            color: #888;
            margin: 0 0 15px 0;
        }
        .controls {
            margin-bottom: 15px;
        }
        button {
            background-color: #111;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            margin: 0 5px;
            border-radius: 4px;
        }
        button:hover {
            background-color: #222;
            border-color: #555;
        }
        #spotify-iframe {
            border-radius: 12px;
            border: 1px solid #222;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <header>
        <h1>CHICO LOCO 40 (CL40)</h1>
        <p>Spotify Official Releases & Playlists</p>
    </header>

    <div class="controls">
        <button onclick="previousRelease()">Previous</button>
        <button onclick="nextRelease()">Next Release</button>
    </div>

    <iframe id="spotify-iframe" 
        src="https://open.spotify.com/embed/album/0nh4NgGBo7v2FMYjW2WyFp?utm_source=generator&theme=0" 
        width="100%" 
        height="352" 
        frameBorder="0" 
        allowfullscreen="" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy">
    </iframe>

    <script>
        const spotifyItems = [
            { type: 'album', id: '0nh4NgGBo7v2FMYjW2WyFp' },
            { type: 'album', id: '6JmCtolQIlV0fuCY1np1cR' },
            { type: 'album', id: '13KUaEibVDjWkSVVNKMprX' },
            { type: 'album', id: '28Uoci2K0KtNo4rwMgpK4F' },
            { type: 'album', id: '5OTekp7JbdOWBgdqDHKPp6' },
            { type: 'playlist', id: '4haHr8QHyGEpXhJWQheqhN' },
            { type: 'album', id: '0YJSBIwhgnudWkCWBq2MYB' },
            { type: 'album', id: '1ViNBf5J3LOo71Xbj4Icl5' },
            { type: 'album', id: '2YPFHQzfB4xZvjNRqbZDAf' },
            { type: 'album', id: '6CV4Hv5yXMr3wDHNWUpcdg' }
        ];

        let currentIndex = 0;

        function updateSpotifyPlayer() {
            const item = spotifyItems[currentIndex];
            const iframe = document.getElementById('spotify-iframe');
            iframe.src = `https://open.spotify.com/embed/${item.type}/${item.id}?utm_source=generator&theme=0`;
        }

        function nextRelease() {
            currentIndex = (currentIndex + 1) % spotifyItems.length;
            updateSpotifyPlayer();
        }

        function previousRelease() {
            currentIndex = (currentIndex - 1 + spotifyItems.length) % spotifyItems.length;
            updateSpotifyPlayer();
        }
    </script>

</body>
</html>
