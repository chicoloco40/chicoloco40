<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CL40 World | TIDAL Stream Ecosystem</title>
    <meta name="author" content="Samir Libari (Chico Loco 40 / CL40)">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        header {
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin: 0 0 5px 0;
            color: #fff;
        }
        p {
            font-size: 0.85rem;
            color: #888;
            margin: 0 0 15px 0;
        }
        .controls {
            margin-bottom: 15px;
        }
        button {
            background-color: #111;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            margin: 0 5px;
            border-radius: 4px;
        }
        button:hover {
            background-color: #222;
            border-color: #555;
        }
        #tidal-iframe {
            border-radius: 12px;
            border: 1px solid #222;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            max-width: 600px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CHICO LOCO 40 (CL40)</h1>
        <p>TIDAL Hi-Res Master Releases</p>
    </header>

    <div class="controls">
        <button onclick="previousRelease()">Previous</button>
        <button onclick="nextRelease()">Next Release</button>
    </div>

    <iframe id="tidal-iframe" 
        src="https://embed.tidal.com/albums/565442171" 
        width="100%" 
        height="380" 
        frameBorder="0" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy">
    </iframe>

    <script>
        const tidalItems = [
            '565442171',
            '530078426',
            '528405766',
            '528168323',
            '525932971',
            '526095790',
            '528168334',
            '525932900',
            '525932555',
            '526315562'
        ];

        let currentIndex = 0;

        function updateTidalPlayer() {
            const albumId = tidalItems[currentIndex];
            const iframe = document.getElementById('tidal-iframe');
            iframe.src = `https://embed.tidal.com/albums/${albumId}`;
        }

        function nextRelease() {
            currentIndex = (currentIndex + 1) % tidalItems.length;
            updateTidalPlayer();
        }

        function previousRelease() {
            currentIndex = (currentIndex - 1 + tidalItems.length) % tidalItems.length;
            updateTidalPlayer();
        }
    </script>

</body>
</html>
